<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatChing</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <!-- AG Grid Community, pinned to an exact version (DECISIONS.md). The integrity hash makes the
       browser refuse the file if the CDN ever serves different bytes. -->
  <script defer src="https://cdn.jsdelivr.net/npm/ag-grid-community@36.2.0/dist/ag-grid-community.min.js"
          integrity="sha384-icvtRKM0YJJgeDhXnWY8UlF1PVBFd4K8Pj61la+vG+EU+awBeoP0xGPZhCD2SQOV"
          crossorigin="anonymous"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header>
    <h1>ChatChing</h1>
    <p id="status" class="status" role="status">Connecting to the server…</p>
  </header>

  <main>
    <section class="card">
      <label for="chat">Chat messages</label>
      <textarea id="chat" rows="8"
                placeholder="Paste a day of chat messages here, e.g.&#10;[28/10 9:02 AM] Lina: hi! can i order 2 boxes of classic brownies, deliver on saturday?"></textarea>
      <div class="controls">
        <label for="chat-date">Chat date</label>
        <input type="date" id="chat-date">
        <button type="button" id="read-orders">Read orders</button>
        <span id="read-message" class="hint" role="status"></span>
      </div>
    </section>

    <section class="card">
      <h2>Orders</h2>
      <div id="grid" class="grid"></div>
    </section>
  </main>
</body>
</html>
